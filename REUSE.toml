version = 1
SPDX-PackageName = "pxs-core"
SPDX-PackageDownloadLocation = "https://github.com/PixelStereo/pxs-core"

# Every file of this repository is offered under the same two licences: the GNU AGPL v3, or a commercial licence granted
# by the copyright holder under a separate agreement (see LICENSING.md). The SPDX expression below is the single place
# that says so; `reuse lint` (run by CI) fails if a file is not covered or a licence text is missing from LICENSES/.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Pixel Stereo"
SPDX-License-Identifier = "AGPL-3.0-only OR LicenseRef-PixelStereo-Commercial"

# Vendored, pinned, unmodified: nlohmann/json 3.11.3 (single header, MIT). Used only inside pxs-core's own sources: none of its
# types is in a public header, so a consumer needs nothing of it. SHA-256 of third_party/nlohmann/json.hpp:
# 9bea4c8066ef4a1c206b2be5a36302f8926f7fdc6087af5d20b417d0cf103ea6 (identical to the release asset and to the file at the tag v3.11.3).
[[annotations]]
path = "third_party/nlohmann/**"
precedence = "override"
SPDX-FileCopyrightText = "2013-2023 Niels Lohmann <https://nlohmann.me>"
SPDX-License-Identifier = "MIT"
