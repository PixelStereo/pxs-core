name: pxs_core
description: Dart bindings to pxs-core, the portable core of the Pixel Stereo applications (OSC, OSCQuery, DMX, MIDI, the address space), through its C interface.
version: 0.16.0
repository: https://github.com/PixelStereo/pxs-core
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  ffi: ^2.2.0

dev_dependencies:
  ffigen: ^23.0.0
  lints: ^6.1.0
  test: ^1.33.0
